<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>PCAP Analyzer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>PCAP Analyzer</h1>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">

            <label class="form-label">
                Selecciona un PCAP
            </label>

            <input
                type="file"
                class="form-control"
                name="pcap"
                accept=".pcap,.pcapng"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary">
            Analizar
        </button>

    </form>

</div>

</body>

</html>
